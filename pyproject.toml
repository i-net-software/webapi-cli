[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webapi-cli"
version = "1.0.0"
description = "CLI client for the i-net Web API MCP endpoint"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
]
keywords = ["webapi", "mcp", "i-net", "cli", "ide"]

[project.scripts]
webapi = "webapi_cli.main:app"

[project.urls]
Repository = "https://github.com/i-net-software/webapi-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/webapi_cli"]
force-include = { "src/webapi_cli/skill.md" = "webapi_cli/skill.md" }

[tool.hatch.build.targets.sdist]
include = [
    "src/webapi_cli/**/*.py",
]
